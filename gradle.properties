org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

## Environment (NeoForge 26.3 port for Zoompack 5, see PORTING-NEOFORGE.md)
minecraft_version       = 26.3
minecraft_version_range = [26.3,26.4)
neo_version             = 26.3.0.89
neo_version_range       = [26.3.0.89,)

## Dependencies
# Create Fly's NeoForge 26.3 port (ZP5 mods/create-fly-neoforge). There is no published build, so the jar is copied
# into libs/ (gitignored); see PORTING-NEOFORGE.md for the commit it was built from.
create_jar             = libs/create-fly-neoforge-6.0.9+neoforge-26.3.jar
create_interfaces      = libs/create-interfaces.json
create_version_range   = [6.0.9,)
# JEI for NeoForge 26.3, the same build the Create port compiles against
jei_version            = 26.3-neoforge:31.15.0.79

## Mod Properties
mod_id          = create_connected
mod_name        = Create: Connected (ZP5 NeoForge Port)
mod_license     = AGPL-3.0-only
mod_version     = 1.3.3-zp5.4+neoforge-26.3
mod_group_id    = com.hlysine.create_connected
mod_authors     = Lysine
mod_description = Unofficial NeoForge 26.3 port of Lysine's Create: Connected, built on Zoompack 5's NeoForge port of ZurrTum's Create Fly and on GravisLudio's Fabric 26.2 Fly port. Not an official release and not maintained by Lysine or GravisLudio.
