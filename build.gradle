// NeoForge 26.3 build of Create: Connected for Zoompack 5, on ZP5's NeoForge port of Create Fly.
// The Fabric 26.2 build this branch started from is in git history (GravisLudio/create-connected-fly main).
// See PORTING-NEOFORGE.md.
plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                url = 'https://maven.blamejared.com'
            }
        }
        filter {
            includeGroup 'mezz.jei'
            includeGroup 'net.mezzdev.config'
        }
    }
}

def modId = project.mod_id
def createJar = file(project.create_jar)

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = modId
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets {
    main {
        java {
            // Integrations with mods that have no NeoForge 26.3 build. Kept in the tree, as upstream did for 26.2.
            exclude 'com/hlysine/create_connected/compat/AdditionalPlacementsCompat.java'  // Additional Placements
            exclude 'com/hlysine/create_connected/compat/CopycatsManager.java'             // Copycats+
            exclude 'com/hlysine/create_connected/compat/DyeDepotCompat.java'              // Dye Depot
            exclude 'com/hlysine/create_connected/compat/SimCompatRegistry.java'           // Simulated
            exclude 'com/hlysine/create_connected/mixin/compat/**'
            exclude 'com/hlysine/create_connected/mixin/linkedtransmitter/ThrottleLeverBlockMixin.java'
            exclude 'com/hlysine/create_connected/content/linkedtransmitter/LinkedThrottleLever*.java'
            // Create Fly has no catnip.config.ui, no ItemUseOverrides and no MountedStorageManager.readLegacy
            exclude 'com/hlysine/create_connected/mixin/featuretoggle/SubMenuConfigScreenMixin.java'
            exclude 'com/hlysine/create_connected/mixin/ItemUseOverridesMixin.java'
            exclude 'com/hlysine/create_connected/mixin/itemsilo/MountedStorageManagerMixin.java'
            // Registrate-era generators, unreferenced since the generated JSON is committed
            exclude 'com/hlysine/create_connected/datagen/CCBlockStateGen.java'
            exclude 'com/hlysine/create_connected/datagen/CCDatagen.java'
            exclude 'com/hlysine/create_connected/content/fluidvessel/FluidVesselGenerator.java'
            exclude 'com/hlysine/create_connected/content/inventoryaccessport/InventoryAccessPortGenerator.java'
            exclude 'com/hlysine/create_connected/content/kineticbattery/KineticBatteryGenerator.java'
        }
        resources {
            srcDir 'src/generated/resources'
            // Fabric-only metadata
            exclude 'fabric.mod.json'
            exclude 'create_connected.classtweaker'
        }
    }
    // Dev-only GameTests (mod create_connected_gametest), never in the jar
    gametest {
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
}

configurations {
    gametestImplementation.extendsFrom implementation
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
    gametestRuntimeClasspath.extendsFrom localRuntime
}

// Create's access transformers widen vanilla members its API exposes (and that this mod's code compiled against on
// Fabric through Create Fly's classtweaker), so the recompiled Minecraft must carry them too
def extractCreateAt = tasks.register('extractCreateAt', Sync) {
    from(zipTree(createJar)) {
        include 'META-INF/accesstransformer.cfg'
        eachFile { path = 'create_accesstransformer.cfg' }
    }
    into layout.buildDirectory.dir('create-at')
    includeEmptyDirs = false
}

neoForge {
    version = project.neo_version

    addModdingDependenciesTo sourceSets.gametest

    accessTransformers {
        from file('src/main/resources/META-INF/accesstransformer.cfg')
        from files(layout.buildDirectory.file('create-at/create_accesstransformer.cfg')).builtBy(extractCreateAt)
    }
    // Compile-time view of the interfaces Create's ContainerMixin/WorldlyContainerMixin add at runtime
    interfaceInjectionData {
        from file(project.create_interfaces)
    }

    mods {
        "${modId}" {
            sourceSet(sourceSets.main)
        }
        create_connected_gametest {
            sourceSet(sourceSets.gametest)
        }
    }

    runs {
        client {
            client()
            sourceSet = sourceSets.gametest
            loadedMods = [mods."${modId}", mods.create_connected_gametest]
        }
        server {
            server()
            sourceSet = sourceSets.gametest
            programArgument '--nogui'
            loadedMods = [mods."${modId}", mods.create_connected_gametest]
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gametest
            // This mod's tests plus Create's own water wheel -> press test as a baseline
            systemProperty 'neoforge.enabledGameTestNamespaces', 'create_connected_gametest,create'
            loadedMods = [mods."${modId}", mods.create_connected_gametest]
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
            if (project.hasProperty('mixinDebug')) {
                systemProperty 'mixin.debug.verbose', 'true'
                systemProperty 'mixin.checks.interfaces', 'true'
            }
        }
    }
}

dependencies {
    // Create Fly (NeoForge port): Create, Flywheel, Ponder and Catnip in one mod jar
    implementation files(createJar)
    compileOnly "mezz.jei:jei-${project.jei_version}"
    if (project.hasProperty('withJei')) {
        localRuntime "mezz.jei:jei-${project.jei_version}"
    }
}

// Expands ${...} placeholders in src/main/templates (neoforge.mods.toml) from gradle.properties
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version_range: project.minecraft_version_range,
            neo_version_range      : project.neo_version_range,
            create_version_range   : project.create_version_range,
            mod_id                 : modId,
            mod_name               : project.mod_name,
            mod_license            : project.mod_license,
            mod_version            : project.mod_version,
            mod_authors            : project.mod_authors,
            mod_description        : project.mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    filesMatching('pack.mcmeta') {
        expand mod_id: modId
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs << '-Xmaxerrs' << '10000'
}

java {
    withSourcesJar()
}

// src/main/resources and src/generated/resources overlap on a few files; the hand-written copy wins, as in processResources
tasks.named('sourcesJar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from('LICENSE')
}

jar {
    from('LICENSE')
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// The GameTests as their own mod jar, for booting the released jar outside this project (see PORTING-NEOFORGE.md)
tasks.register('gametestJar', Jar) {
    archiveClassifier = 'gametest'
    from sourceSets.gametest.output
}
